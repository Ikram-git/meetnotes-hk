name: Build Mac desktop app

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish as a GitHub release (tag will be desktop-v<version-from-cargo>)'
        type: boolean
        default: false
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (with Intel + Apple Silicon targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Read app version
        id: version
        working-directory: apps/desktop/src-tauri
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Briva v$VERSION"

      - name: Build universal Mac binary
        working-directory: apps/desktop
        run: cargo tauri build --target universal-apple-darwin
        env:
          # No signing — produces unsigned .dmg. Users will need to
          # right-click → Open the first time, or run:
          #   xattr -dr com.apple.quarantine /Applications/Briva.app
          # To enable signing later, add APPLE_CERTIFICATE / APPLE_ID
          # secrets and uncomment below.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: true

      - name: Collect artifacts
        id: artifacts
        run: |
          BUNDLE_DIR=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist-mac
          # .dmg (installer)
          if compgen -G "$BUNDLE_DIR/dmg/*.dmg" > /dev/null; then
            cp "$BUNDLE_DIR/dmg/"*.dmg dist-mac/
          fi
          # .app.tar.gz (raw app bundle, used by Tauri updater)
          if compgen -G "$BUNDLE_DIR/macos/*.app.tar.gz" > /dev/null; then
            cp "$BUNDLE_DIR/macos/"*.app.tar.gz dist-mac/
          fi
          ls -la dist-mac/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: briva-mac-v${{ steps.version.outputs.version }}
          path: dist-mac/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || format('desktop-v{0}', steps.version.outputs.version) }}
          name: Briva Desktop v${{ steps.version.outputs.version }} (macOS)
          body: |
            Universal macOS build of Briva v${{ steps.version.outputs.version }} (Intel + Apple Silicon).

            **Install:** Download the `.dmg`, open it, drag Briva into Applications.

            **First launch:** This build is unsigned — macOS will block it the first time. Right-click the app and choose *Open*, then confirm. Or in Terminal:
            ```
            xattr -dr com.apple.quarantine /Applications/Briva.app
            ```

            **For system-audio capture** (recording / live transcription of what's playing): install [BlackHole 2ch](https://existential.audio/blackhole/) and either select it as your output device or create a Multi-Output device combining your speakers + BlackHole in *Audio MIDI Setup*. Without this, Briva will only capture your microphone.
          files: dist-mac/*
          draft: false
          prerelease: false
