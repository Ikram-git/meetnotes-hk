[package]
name = "meetnotes-desktop"
version = "0.1.0"
description = "MeetNotes desktop app"
authors = ["MeetNotes"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
cpal = "0.15"
hound = "3.5"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
