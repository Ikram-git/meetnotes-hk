<!DOCTYPE html>
<html>
<head>
  <title>Briva - Recording</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      height: 80px;
      background: #080c0a;
      color: #f0fdf4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 16px;
      overflow: hidden;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .text { font-size: 13px; color: #9ca3af; }
    .status { color: #34d399; font-weight: 600; font-size: 13px; }
  </style>
</head>
<body>
  <div class="dot"></div>
  <span class="status">Recording</span>
  <span class="text" id="info">Starting...</span>
  <script src="recorder.js"></script>
</body>
</html>
